name: CI

# Runs on every push and every pull request: style check, then all tests.
# It uses NO secrets and NO data: the tests use made-up data, and the tests that need the real
# Freddie Mac files skip themselves when the files are absent (they must never be uploaded to GitHub).

on:
  push:
  pull_request:

permissions:
  contents: read          # the least a workflow needs: it can read the code and nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push on the same branch cancels the older, now useless, run

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the pinned libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Style and common mistakes (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      # --- the API container: built and tested on every push, so a broken image is found before any deployment ---
      - name: Build the API container image
        run: |
          for attempt in 1 2 3 4; do
            if docker build -t scoring-api:ci .; then exit 0; fi
            echo "Build failed (attempt $attempt of 4). The base images come from public registries that sometimes answer 429 Too Many Requests to the shared GitHub machines: waiting, then trying again."
            sleep $((attempt * 30))
          done
          exit 1

      - name: Check what is inside the image (only the expected files, no data, no tests)
        run: |
          docker run --rm --entrypoint sh scoring-api:ci -c 'find /app -type f | sort' > /tmp/image_files.txt
          cat /tmp/image_files.txt
          diff scripts/expected_image_files.txt /tmp/image_files.txt

      - name: Smoke-test the running container (health, golden loan, clean refusals)
        run: |
          docker run -d --name api -p 8080:8080 scoring-api:ci
          python scripts/smoke_test_api.py --url http://127.0.0.1:8080 --wait 60

      - name: Container logs (only when something failed)
        if: failure()
        run: docker logs api || true

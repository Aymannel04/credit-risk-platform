name: Deploy

# Deploys the scoring API to AWS Lambda when code is pushed to main. NO AWS password is stored anywhere:
# the job shows GitHub's signed ID card (OIDC) to AWS and receives a temporary key that lasts about an hour.
# The role behind it (infra/05_create_github_deploy.ps1) trusts ONLY this repository on ONLY its main branch,
# and may only push to one ECR repository and update one Lambda function.
#
# Order matters: everything is tested FIRST with no AWS access; the temporary key is requested only after the
# tests and the container checks passed; the live URL is smoke-tested at the end and a failure turns the run red.
# The job is skipped until the repository variable AWS_DEPLOY_ROLE_ARN exists (a non-secret address, see infra/README.md).
# Actions are pinned to exact commits, not to tags that can move (this job holds cloud access).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false   # never cancel a deployment half-way: a newer one waits its turn

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: credit-scoring-api
  LAMBDA_FUNCTION: credit-scoring-api

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-24.04   # pinned: 'ubuntu-latest' moves to a new OS version on 2026-10-19 and a deploy must not change under us
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # lets the job ask GitHub for its ID card (the OIDC token); nothing else
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the pinned libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Style and common mistakes (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q

      # --- the image: built for ONE architecture without extra metadata (Lambda rejects both multi-architecture images and attestations) ---
      - name: Build the API container image
        run: |
          echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          for attempt in 1 2 3 4; do
            if docker build --platform linux/amd64 --provenance=false --sbom=false -t scoring-api:deploy .; then exit 0; fi
            echo "Build failed (attempt $attempt of 4). The base images come from public registries that sometimes answer 429 Too Many Requests to the shared GitHub machines: waiting, then trying again."
            sleep $((attempt * 30))
          done
          exit 1

      - name: Check what is inside the image (only the expected files, no data, no tests)
        run: |
          docker run --rm --entrypoint sh scoring-api:deploy -c 'find /app -type f | sort' > /tmp/image_files.txt
          cat /tmp/image_files.txt
          diff scripts/expected_image_files.txt /tmp/image_files.txt

      - name: Smoke-test the running container (health, golden loan, clean refusals)
        run: |
          docker run -d --name api -p 8080:8080 scoring-api:deploy
          python scripts/smoke_test_api.py --url http://127.0.0.1:8080 --wait 60

      - name: Container logs (only when something failed)
        if: failure()
        run: docker logs api || true

      # --- only now does the job ask AWS for a temporary key ---
      - name: Get a temporary AWS key (OIDC, no stored password)
        id: aws_login
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-deploy-${{ github.run_id }}
          retry-max-attempts: 3   # default is 12 (about a minute lost when AWS says no); a refused ID card does not become valid on the 12th try

      # Only runs when the login above failed: prints the NON-secret claims on GitHub's ID card (what AWS compares with the role's trust rule).
      # The token itself is never printed.
      - name: Diagnose a failed OIDC login (prints only non-secret claims)
        if: failure() && steps.aws_login.outcome == 'failure'
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import sys, json, base64
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "repository_owner", "ref", "event_name", "job_workflow_ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Push the image to ECR (tag = git commit; tags are immutable, so an existing tag is reused)
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCOUNT"
          REGISTRY="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_ENV"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "The tag $TAG is already in the repository: not pushing again."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            docker tag scoring-api:deploy "$REGISTRY/$ECR_REPOSITORY:$TAG"
            docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
            docker logout "$REGISTRY"
          fi
          MEDIA=$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" --query 'images[0].imageManifestMediaType' --output text)
          case "$MEDIA" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) echo "Stored as a single image ($MEDIA)." ;;
            *) echo "::error::The stored manifest is '$MEDIA': Lambda needs a single image, not an index."; exit 1 ;;
          esac
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Point the Lambda function at the new image and wait until it is ready
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$LAMBDA_FUNCTION" --image-uri "$IMAGE" --query '[LastUpdateStatus,State]' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION"
          STATE=$(aws lambda get-function-configuration --function-name "$LAMBDA_FUNCTION" --query '[State,LastUpdateStatus]' --output text)
          echo "State and last update: $STATE"
          test "$STATE" = "$(printf 'Active\tSuccessful')"
          RESOLVED=$(aws lambda get-function --function-name "$LAMBDA_FUNCTION" --query 'Code.ResolvedImageUri' --output text)
          case "$RESOLVED" in
            *"$DIGEST"*) echo "The function runs exactly the image that was pushed ($DIGEST)." ;;
            *) echo "::error::The function does not run the pushed image (digest $DIGEST)."; exit 1 ;;
          esac

      - name: Smoke-test the LIVE locked URL with signed requests
        run: |
          set -euo pipefail
          URL=$(aws lambda get-function-url-config --function-name "$LAMBDA_FUNCTION" --query FunctionUrl --output text)
          echo "::add-mask::$URL"
          python scripts/smoke_test_api.py --url "$URL" --aws-default-credentials --wait 90

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed"
            echo "- git commit / image tag: \`$TAG\`"
            echo "- image digest: \`$DIGEST\`"
            echo "- live smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: How to go back (only when something failed)
        if: failure()
        run: |
          echo "If the live function is broken, put the previous image back from your computer:"
          echo "  aws ecr describe-images --repository-name $ECR_REPOSITORY --query 'sort_by(imageDetails,&imagePushedAt)[].imageTags' --profile credit-admin --region $AWS_REGION"
          echo "  aws lambda update-function-code --function-name $LAMBDA_FUNCTION --image-uri <registry>/$ECR_REPOSITORY:<previous tag> --profile credit-admin --region $AWS_REGION"

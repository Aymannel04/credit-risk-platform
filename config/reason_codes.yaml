# Fixed, human-written sentences for reason codes. A reason is shown for the scorecard features where a loan
# loses the most points compared with the best band of that feature. Never generated by a language model.
credit_score:     {code: R01, phrase: "Credit score is lower than for the safest applicants"}
rate_spread:      {code: R02, phrase: "Interest rate is above other loans of the same period and term (the lender priced extra risk)"}
dti:              {code: R03, phrase: "Monthly debts are a high share of income (debt-to-income ratio)"}
channel:          {code: R04, phrase: "Loan came through a channel with a higher observed default rate"}
orig_term:        {code: R05, phrase: "Loan term differs from the lowest-risk term group"}
cltv:             {code: R06, phrase: "Total borrowing is a high share of the property value (combined loan-to-value)"}
ltv:              {code: R07, phrase: "Loan is a high share of the property value (loan-to-value)"}
n_borrowers:      {code: R08, phrase: "Number of borrowers on the loan is associated with higher risk"}
state:            {code: R09, phrase: "Property location (state) has a higher observed default rate"}
mi_pct:           {code: R10, phrase: "Mortgage insurance coverage level is associated with higher risk"}
# NOT reportable: the flag only exists for loans after October 2008, so in these data it mostly separates
# crisis-era loans from later ones (an era proxy, found on 2026-10-10). It must not be shown to an applicant.
super_conforming: {code: R11, phrase: "Loan size is above the standard conforming limit", reportable: false}
